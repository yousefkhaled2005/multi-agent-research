[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research"
version = "1.0.0"
description = "Stateful Multi-Agent Academic and Technical Research Engine with LangGraph"
readme = "README.md"
authors = [{ name = "Yousef Khaled", email = "youssef460249@beng.bu.edu.eg" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.26",
    "langchain>=0.1.13"
]
